name: Auto Assign PR

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-assign:
    name: Auto assign PR author
    runs-on: ubuntu-latest

    steps:
      - name: Auto assign pull request
        uses: kentaro-m/auto-assign-action@v2.0.0
        with:
          configuration-path: .github/auto_assign.yml