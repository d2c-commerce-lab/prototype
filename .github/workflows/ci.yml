name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: d2c_commerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d d2c_commerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_PORT: 8000
      POSTGRES_DB: d2c_commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/d2c_commerce

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
        working-directory: .

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt
          pip install ruff pylint pytest

      - name: Run Ruff
        run: |
          ruff check backend tests

      - name: Run Pylint
        run: |
          pylint backend tests

      - name: Apply database schema
        run: |
          psql "$DATABASE_URL" -f ../../db/ddl/schema.sql

      - name: Load seed data
        run: |
          psql "$DATABASE_URL" -f ../../db/seeds/seed_categories.sql
          psql "$DATABASE_URL" -f ../../db/seeds/seed_campaigns.sql
          psql "$DATABASE_URL" -f ../../db/seeds/seed_products.sql
          psql "$DATABASE_URL" -f ../../db/seeds/seed_coupons.sql

      - name: Run backend tests
        run: |
          python -m pytest ./tests -v

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    env:
      VITE_API_BASE_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build